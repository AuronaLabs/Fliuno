name: Investigate Linux bundle startup
on:
  push:
    branches: [codex/verify-node-runtime]
permissions:
  actions: read
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: '46075145812'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: fliuno-debian-candidate
          path: candidate
      - name: Load the verified candidate
        run: |
          test "$(cat candidate/SOURCE-COMMIT.txt)" = c321a498fb2a223ae006538d3799d01243b350db
          (cd candidate && sha256sum -c SHA256SUMS.txt)
          tar -xzf candidate/fliuno-v0.0.17-linux-x64.tar.gz -C candidate
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace
      - name: Reproduce the offline bundle example
        env:
          FLIUNO_DEMO_BIN_DIR: ${{ github.workspace }}/candidate/fliuno-v0.0.17-linux-x64
        run: |
          uname -a
          command -v node
          ldd "$(command -v node)"
          if python examples/bundle_demo.py; then
            echo 'The verified release build works with the runner runtime.'
          else
            strace -f -s 300 -e trace=execve,write,writev -o "$RUNNER_TEMP/fliuno-node.trace" python examples/bundle_demo.py || true
            grep -E 'write(v)?\(2,|execve\(' "$RUNNER_TEMP/fliuno-node.trace" | tail -70
            exit 1
          fi
