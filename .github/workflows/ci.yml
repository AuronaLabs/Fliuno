name: kernel
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy -p fliuno-sandbox --all-targets --no-default-features --locked -- -D warnings
      - name: Run workspace tests with isolated native fixtures
        # Process tests start PTYs and servers with wall-clock deadlines.
        run: cargo test --workspace --all-features --locked -- --test-threads=1
      - name: Verify project Agent through a real terminal and native sandbox
        run: |
          cargo build --locked -p fliuno-app-server --features test-fixtures --bins
          cargo test --locked -p fliuno-tui --test workbench live_project_agent_delivers_inline_then_edits_and_runs_a_native_check -- --ignored
      - name: Verify supplier settings through a real terminal
        run: cargo test --locked -p fliuno-tui --test workbench workbench_manages_shared_suppliers_and_applies_only_the_selected_model -- --ignored
      - name: Verify bilingual project workflow through a real terminal
        run: cargo test --locked -p fliuno-tui --test workbench workbench_keeps_language_draft_and_exact_project_review_at_terminal_widths -- --ignored
      - name: Verify long approval previews through a real terminal
        run: cargo test --locked -p fliuno-tui --test workbench workbench_review_keeps_long_preview_and_tool_details_separate -- --ignored
      - run: python scripts/check_linux_cgroup.py
        if: runner.os == 'Linux'
      - run: python scripts/export_schema.py --check
      - run: python examples/demo.py
      - run: python examples/context_demo.py
      - run: python examples/skills_demo.py
      - run: python examples/skills_demo.py --deny
      - run: python examples/skills_demo.py --switch-source
      - run: python examples/bundle_demo.py
      - run: python examples/bundle_demo.py --deny
      - run: python examples/bundle_demo.py --tamper
      - run: python examples/bundle_demo.py --runtime python
        if: runner.os == 'Windows'
      - run: python examples/bundle_demo.py --runtime python --deny
        if: runner.os == 'Windows'
      - run: python examples/bundle_demo.py --runtime python --tamper
        if: runner.os == 'Windows'
      - run: python examples/mcp_http_demo.py
      - run: python examples/mcp_http_demo.py --sse
      - run: python examples/mcp_http_demo.py --legacy --sse
      - run: python examples/mcp_http_demo.py --deny
      - run: python examples/mcp_content_demo.py
      - run: python examples/mcp_content_demo.py --deny
      - run: python examples/mcp_content_demo.py --switch-source
      - run: python examples/a2a_demo.py
      - run: python examples/a2a_demo.py --cancel
      - run: python examples/agent_demo.py
        if: runner.os == 'Windows'
      - run: python examples/agent_demo.py --deny
        if: runner.os == 'Windows'
      - run: python examples/agent_demo.py --workspace
        if: runner.os == 'Windows'
      - run: python examples/agent_demo.py --workspace --deny
        if: runner.os == 'Windows'
