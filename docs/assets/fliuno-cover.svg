<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title description">
  <title id="title">Fliuno · Rust agent kernel</title>
  <desc id="description">A local execution trace shows a task starting, an approval being granted, and an artifact being read.</desc>
  <defs>
    <clipPath id="frame"><rect width="1120" height="360" rx="24"/></clipPath>
    <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#101f1a"/>
      <stop offset="1" stop-color="#132d25"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#acddbf" stroke-opacity=".13"/>
    </pattern>
  </defs>

  <g clip-path="url(#frame)">
    <path d="M0 0h1120v360H0z" fill="url(#background)"/>
    <path d="M504 0h616v360H504z" fill="url(#grid)"/>
    <path d="M504 0v360" stroke="#426057"/>
    <path d="M60 307h380" stroke="#426057"/>
    <path d="M60 307h38" stroke="#d1f49e" stroke-width="2"/>

    <g transform="translate(60 54)">
      <rect width="48" height="48" rx="12" fill="#d1f49e"/>
      <path d="M15 34V18a4 4 0 0 1 4-4h15M15 25h13" fill="none" stroke="#172820" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
      <text x="125" y="84" fill="#d1f49e" font-size="18" letter-spacing="3">LOCAL WORK</text>
      <text x="64" y="251" fill="#cce1d5" font-size="24" letter-spacing="3">RUST AGENT KERNEL</text>
      <text x="60" y="331" fill="#adc6b9" font-size="14" letter-spacing="1.5">TASKS  /  APPROVALS  /  ARTIFACTS</text>
    </g>
    <text x="52" y="210" fill="#f4f8f2" font-family="'Segoe UI', system-ui, sans-serif" font-size="126" font-weight="700" letter-spacing="-4">Fliuno</text>

    <g transform="translate(550 52)" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
      <rect width="514" height="256" rx="15" fill="#101d19" stroke="#58776b"/>
      <path d="M0 48h514M18 116h478m-478 64h478" stroke="#385249"/>
      <text x="22" y="30" fill="#b9d1c6" font-size="15" letter-spacing="1.7">EXECUTION TRACE</text>
      <text x="492" y="30" fill="#b9d1c6" font-size="15" text-anchor="end">JSON-RPC / STDIO</text>

      <path d="M32 84v128" stroke="#58776b" stroke-width="2"/>
      <circle cx="32" cy="84" r="7" fill="#a8ccff" stroke="#101d19" stroke-width="3"/>
      <rect x="25" y="141" width="14" height="14" rx="2" transform="rotate(45 32 148)" fill="#ffdb91" stroke="#101d19" stroke-width="3"/>
      <circle cx="32" cy="212" r="7" fill="#d1f49e" stroke="#101d19" stroke-width="3"/>
      <g fill="#f0f7f2" font-size="23">
        <text x="57" y="92">task/start</text>
        <text x="57" y="156">approval/respond</text>
        <text x="57" y="220">artifacts/read</text>
      </g>
      <rect x="348" y="68" width="144" height="32" rx="8" fill="#1c3039"/>
      <rect x="348" y="132" width="144" height="32" rx="8" fill="#3b3020"/>
      <rect x="348" y="196" width="144" height="32" rx="8" fill="#283a24"/>
      <g font-size="16" text-anchor="middle">
        <text x="420" y="90" fill="#bbd5ff">running</text>
        <text x="420" y="154" fill="#ffdb91">allow_once</text>
        <text x="420" y="218" fill="#d1f49e">saved locally</text>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1119" height="359" rx="23.5" fill="none" stroke="#58776b"/>
</svg>
