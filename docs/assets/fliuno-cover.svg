<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Fliuno · Rust Agent Kernel</title>
  <desc id="description">An example of the Fliuno task lifecycle: start a task, approve a tool call, then read the artifact.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#90b6a4" stroke-opacity=".12"/>
    </pattern>
    <pattern id="approval-lines" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v8" stroke="#f1d285" stroke-opacity=".3" stroke-width="2"/>
    </pattern>
  </defs>
  <g clip-path="url(#frame)">
    <path d="M0 0h1200v320H0z" fill="#111b18"/>
    <path d="M509 0h691v320H509z" fill="#172822"/>
    <path d="M509 0h691v320H509z" fill="url(#grid)"/>
    <path d="M509 0v320M0 271h509" stroke="#375247"/>
    <path d="M0 271h64" stroke="#c9f38d" stroke-width="2"/>

    <g transform="translate(64 49)">
      <rect width="58" height="58" rx="12" fill="#c9f38d"/>
      <path d="M18 43V20a5 5 0 0 1 5-5h18M18 29h16" fill="none" stroke="#15251a" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="60" y="201" fill="#f1f6ef" font-family="'Segoe UI', system-ui, sans-serif" font-size="110" font-weight="700">Fliuno</text>
    <g font-family="ui-monospace, Consolas, monospace" font-size="20">
      <text x="65" y="242" fill="#b8d7c7" letter-spacing="3">RUST AGENT KERNEL</text>
      <text x="65" y="301" fill="#a2bcaf" font-size="16" letter-spacing="1">TASKS / APPROVALS / ARTIFACTS</text>
    </g>

    <g transform="translate(549 37)">
      <rect width="597" height="246" rx="11" fill="#101d18" stroke="#4c6d5e"/>
      <path d="M0 46h597M22 112h553M22 172h553" stroke="#344d41"/>
      <path d="M34 77v123" stroke="#547664" stroke-width="1.5"/>
      <circle cx="34" cy="82" r="5" fill="#a4c8ff" stroke="#101d18" stroke-width="2"/>
      <rect x="29" y="137" width="10" height="10" rx="2" transform="rotate(45 34 142)" fill="#ffd989" stroke="#101d18" stroke-width="2"/>
      <circle cx="34" cy="202" r="5" fill="#c9f38d" stroke="#101d18" stroke-width="2"/>

      <g font-family="ui-monospace, Consolas, monospace">
        <text x="24" y="29" fill="#b8d7c7" font-size="15" letter-spacing="2">TASK LIFECYCLE</text>
        <text x="573" y="29" fill="#9ab8aa" font-size="15" text-anchor="end">JSON-RPC</text>
        <g fill="#f1f6ef" font-size="23">
          <text x="58" y="90">task/start</text>
          <text x="58" y="150">approval/respond</text>
          <text x="58" y="210">artifacts/read</text>
        </g>
        <g font-size="18" text-anchor="end">
          <text x="573" y="89" fill="#a4c8ff">running</text>
          <text x="573" y="149" fill="#ffd989">allow_once</text>
          <text x="573" y="209" fill="#c9f38d">saved locally</text>
        </g>
      </g>
      <path d="M23 233h138" stroke="#a4c8ff" stroke-width="3"/>
      <rect x="166" y="231.5" width="87" height="3" fill="url(#approval-lines)"/>
      <path d="M258 233h316" stroke="#c9f38d" stroke-width="3"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="19.5" fill="none" stroke="#547664"/>
</svg>
