    <g transform="translate(24 24)"><rect x="0" y="0" width="34" height="34" rx="9" fill="#983c17" stroke="none"/><path d="M9 25V13l4-4h12M9 17h10" fill="none" stroke="#fff7ed" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24.5" cy="17" r="1.7" fill="#fff7ed"/></g>
