<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
  <title id="title">Fliuno</title>
  <desc id="desc">A local Rust agent kernel. A task is submitted, approved and saved as a deliverable.</desc>
  <defs>
    <linearGradient id="paper" x1="0%" y1="10%" x2="100%" y2="95%">
      <stop stop-color="#f7faf6"/>
      <stop offset="1" stop-color="#e8f3ed"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#60877b" opacity=".38"/>
    </pattern>
    <clipPath id="frame"><rect width="1120" height="330" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1120" height="330" fill="url(#paper)"/>
    <rect x="559" width="561" height="330" fill="url(#grid)"/>
    <path d="M509 330h42l170-170h1120" fill="none" stroke="#afc9bf" opacity=".5"/>
    <g transform="translate(54 42)">
      <rect width="36" height="36" rx="10" fill="#18664f"/>
      <path d="M10 26V14l4-4h12M10 18h10" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="25" cy="18" r="1.7" fill="#ffffff"/>
    </g>
    <text x="104" y="65" font-family="ui-monospace, Cascadia Mono, Consolas, monospace" font-size="15" font-weight="650" letter-spacing="1.35" fill="#18664f">RUST  /  LOCAL EXECUTION</text>
    <text x="51" y="180" font-family="system-ui, Segoe UI, sans-serif" font-size="92" font-weight="740" letter-spacing="-4.5" fill="#12302c">Fliuno</text>
    <text x="54" y="224" font-family="system-ui, Segoe UI, sans-serif" font-size="29" font-weight="540" letter-spacing="0" fill="#435f58">Agent kernel for workspaces</text>
    <g transform="translate(566 72)">
      <rect width="497" height="190" rx="16" fill="#ffffff" stroke="#afc9bf"/>
      <text x="22" y="29" font-family="ui-monospace, Cascadia Mono, Consolas, monospace" font-size="15" font-weight="650" letter-spacing="1.8" fill="#435f58">TASK TIMELINE</text>
      <path d="M22 43H475M27 61V163" fill="none" stroke="#cfdfd7" stroke-width="1.5"/>
      <circle cx="27" cy="61" r="5" fill="#18664f"/>
      <text x="48" y="67" font-family="system-ui, Segoe UI, sans-serif" font-size="21" font-weight="650" letter-spacing="0" fill="#12302c">Task submitted</text>
      <text x="282" y="67" font-family="ui-monospace, Cascadia Mono, Consolas, monospace" font-size="15" font-weight="500" letter-spacing="0" fill="#18664f">task/start</text>
      <circle cx="27" cy="112" r="5" fill="#874521"/>
      <text x="48" y="118" font-family="system-ui, Segoe UI, sans-serif" font-size="21" font-weight="650" letter-spacing="0" fill="#12302c">Approval required</text>
      <text x="282" y="118" font-family="ui-monospace, Cascadia Mono, Consolas, monospace" font-size="15" font-weight="500" letter-spacing="0" fill="#874521">waiting_approval</text>
      <circle cx="27" cy="163" r="5" fill="#18664f"/>
      <text x="48" y="169" font-family="system-ui, Segoe UI, sans-serif" font-size="21" font-weight="650" letter-spacing="0" fill="#12302c">Deliverable saved</text>
      <text x="282" y="169" font-family="ui-monospace, Cascadia Mono, Consolas, monospace" font-size="15" font-weight="500" letter-spacing="0" fill="#18664f">completed</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1119" height="329" rx="23.5" fill="none" stroke="#afc9bf"/>
</svg>
