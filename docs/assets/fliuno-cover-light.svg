    <text x="50" y="175" font-family="system-ui, Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="92" font-weight="740" letter-spacing="-4" fill="#12302c">Fliuno</text>
    <text x="54" y="222" font-family="system-ui, Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="550" letter-spacing="0" fill="#435f58">面向工作台的本机 Agent 内核</text>
