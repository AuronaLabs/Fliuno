<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="292" viewBox="0 0 1120 292" role="img" aria-labelledby="title desc">
  <title id="title">Fliuno | Local agent kernel</title>
  <desc id="desc">A local task trace: submit a task, review the approval, and collect the saved deliverable.</desc>
  <defs>
    <clipPath id="frame"><rect x="0.5" y="0.5" width="1119" height="291" rx="23" fill="#f1f7f3" stroke="none"/></clipPath>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d4e4dc"/></pattern>
  </defs>
  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1120" height="292" rx="23" fill="#f1f7f3" stroke="none"/>
    <rect x="560" y="0" width="560" height="292" rx="0" fill="url(#grid)" stroke="none"/>
    <g transform="translate(56 45)"><rect x="0" y="0" width="34" height="34" rx="9" fill="#1b6e54" stroke="none"/><path d="M9 25V13l4-4h12M9 17h10" fill="none" stroke="#f1f7f3" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24.5" cy="17" r="1.7" fill="#f1f7f3"/></g>
    <text x="104" y="67" font-family="'Cascadia Mono', Consolas, monospace" font-size="13" fill="#1b6e54" font-weight="650" letter-spacing="1.4" text-anchor="start">LOCAL AGENT KERNEL</text>
    <text x="51" y="173" font-family="system-ui, 'Segoe UI', sans-serif" font-size="104" fill="#172c26" font-weight="780" letter-spacing="0" text-anchor="start">Fliuno</text>
    <text x="56" y="215" font-family="system-ui, 'Segoe UI', sans-serif" font-size="27" fill="#466158" font-weight="500" letter-spacing="0" text-anchor="start">From task to deliverable.</text>
    <g transform="translate(544 45)">
    <rect x="0" y="0" width="520" height="201" rx="10" fill="#fbfdfa" stroke="#b3c9be"/>
    <text x="24" y="29" font-family="'Cascadia Mono', Consolas, monospace" font-size="12" fill="#466158" font-weight="650" letter-spacing="1.3" text-anchor="start">TASK TRACE</text>
    <text x="496" y="29" font-family="'Cascadia Mono', Consolas, monospace" font-size="12" fill="#466158" font-weight="650" letter-spacing="0" text-anchor="end">LOCAL RUN</text>
    <path d="M24 56H496" fill="none" stroke="#b3c9be" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M29 75v84" fill="none" stroke="#b3c9be" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="24" y="70" width="10" height="10" rx="3" fill="#466158" stroke="none"/>
    <text x="48" y="80" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" fill="#172c26" font-weight="650" letter-spacing="0" text-anchor="start">Task submitted</text>
    <text x="496" y="79" font-family="'Cascadia Mono', Consolas, monospace" font-size="15" fill="#466158" font-weight="650" letter-spacing="0" text-anchor="end">task/start</text>
    <rect x="24" y="112" width="10" height="10" rx="3" fill="#8a471c" stroke="none"/>
    <text x="48" y="122" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" fill="#172c26" font-weight="650" letter-spacing="0" text-anchor="start">Approval required</text>
    <text x="496" y="121" font-family="'Cascadia Mono', Consolas, monospace" font-size="15" fill="#8a471c" font-weight="650" letter-spacing="0" text-anchor="end">waiting_approval</text>
    <rect x="24" y="154" width="10" height="10" rx="3" fill="#1b6e54" stroke="none"/>
    <text x="48" y="164" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" fill="#172c26" font-weight="650" letter-spacing="0" text-anchor="start">Deliverable saved</text>
    <text x="496" y="163" font-family="'Cascadia Mono', Consolas, monospace" font-size="15" fill="#1b6e54" font-weight="650" letter-spacing="0" text-anchor="end">completed</text>
