    </g>
    <text x="92" y="53" font-family="ui-monospace, Cascadia Mono, Consolas, monospace" font-size="15" font-weight="650" letter-spacing="1.5" fill="#9ce9cd">LOCAL  /  RUST</text>
    <text x="38" y="143" font-family="system-ui, Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="84" font-weight="740" letter-spacing="-4" fill="#f0f8f5">Fliuno</text>
    <text x="42" y="181" font-family="system-ui, Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="550" letter-spacing="0" fill="#b7cec8">面向工作台的本机 Agent 内核</text>
    <g transform="translate(42 208)">
