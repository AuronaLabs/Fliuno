    <text x="15" y="29" font-family="'Cascadia Mono', Consolas, monospace" font-size="11" fill="#c3baca" font-weight="650" letter-spacing="1.5" text-anchor="start">TASK LIFECYCLE</text>
    <rect x="15" y="47" width="123" height="67" rx="9" fill="#151417" stroke="#c3baca"/>
