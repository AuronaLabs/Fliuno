    <rect x="154" y="47" width="123" height="67" rx="9" fill="#151417" stroke="#ffb789"/>
    <g transform="translate(165 57)"><path d="M7 11V8a5 5 0 0110 0v3M5 11h14v10H5zM12 15v2" fill="none" stroke="#ffb789" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="267" y="72" font-family="'Cascadia Mono', Consolas, monospace" font-size="10" fill="#ffb789" font-weight="650" letter-spacing="0" text-anchor="end">02</text>
