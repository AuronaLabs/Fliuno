<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
  <title id="title">Fliuno — Rust agent kernel</title>
  <desc id="desc">Submit a task, approve an operation, and collect a deliverable.</desc>
  <defs>
    <clipPath id="frame"><rect x="0.5" y="0.5" width="479" height="359" rx="23" fill="#151417" stroke="none"/></clipPath>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#35313c"/></pattern>
  </defs>
