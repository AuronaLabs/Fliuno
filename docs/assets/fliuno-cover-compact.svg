<svg xmlns="http://www.w3.org/2000/svg" width="620" height="454" viewBox="0 0 620 454" role="img" aria-labelledby="title desc">
  <title id="title">Fliuno</title>
  <desc id="desc">面向工作台的本机 Rust Agent 内核。任务经过提交、审批和交付三个阶段。</desc>
  <defs>
