    <rect x="216.0" y="0" width="264.0" height="360" rx="0" fill="url(#grid)" stroke="none"/>
    <g transform="translate(24 23)"><rect x="0" y="0" width="34" height="34" rx="9" fill="#ffb789" stroke="none"/><path d="M9 25V13l4-4h12M9 17h10" fill="none" stroke="#151417" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24.5" cy="17" r="1.7" fill="#151417"/></g>
