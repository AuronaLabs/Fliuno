<svg xmlns="http://www.w3.org/2000/svg" width="440" height="326" viewBox="0 0 440 326" role="img" aria-labelledby="title desc">
  <title id="title">Fliuno | Local agent kernel</title>
  <desc id="desc">A local task trace: submit a task, review the approval, and collect the saved deliverable.</desc>
  <defs>
    <clipPath id="frame"><rect x="0.5" y="0.5" width="439" height="325" rx="23" fill="#f1f7f3" stroke="none"/></clipPath>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d4e4dc"/></pattern>
  </defs>
  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="440" height="326" rx="23" fill="#f1f7f3" stroke="none"/>
    <rect x="220" y="0" width="220" height="326" rx="0" fill="url(#grid)" stroke="none"/>
    <g transform="translate(22 20)"><rect x="0" y="0" width="34" height="34" rx="9" fill="#1b6e54" stroke="none"/><path d="M9 25V13l4-4h12M9 17h10" fill="none" stroke="#f1f7f3" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24.5" cy="17" r="1.7" fill="#f1f7f3"/></g>
    <text x="70" y="42" font-family="'Cascadia Mono', Consolas, monospace" font-size="12" fill="#1b6e54" font-weight="650" letter-spacing="1.4" text-anchor="start">LOCAL AGENT KERNEL</text>
    <text x="20" y="106" font-family="system-ui, 'Segoe UI', sans-serif" font-size="59" fill="#172c26" font-weight="780" letter-spacing="0" text-anchor="start">Fliuno</text>
    <text x="22" y="134" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" fill="#466158" font-weight="500" letter-spacing="0" text-anchor="start">From task to deliverable.</text>
    <g transform="translate(22 145)">
    <rect x="0" y="0" width="396" height="161" rx="10" fill="#fbfdfa" stroke="#b3c9be"/>
    <text x="16" y="24" font-family="'Cascadia Mono', Consolas, monospace" font-size="12" fill="#466158" font-weight="650" letter-spacing="1.3" text-anchor="start">TASK TRACE</text>
    <text x="380" y="24" font-family="'Cascadia Mono', Consolas, monospace" font-size="12" fill="#466158" font-weight="650" letter-spacing="0" text-anchor="end">LOCAL RUN</text>
    <path d="M16 37H380" fill="none" stroke="#b3c9be" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M21 56v68" fill="none" stroke="#b3c9be" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="16" y="51" width="10" height="10" rx="3" fill="#466158" stroke="none"/>
    <text x="40" y="61" font-family="system-ui, 'Segoe UI', sans-serif" font-size="17" fill="#172c26" font-weight="650" letter-spacing="0" text-anchor="start">Task submitted</text>
    <text x="380" y="60" font-family="'Cascadia Mono', Consolas, monospace" font-size="13" fill="#466158" font-weight="650" letter-spacing="0" text-anchor="end">task/start</text>
    <rect x="16" y="85" width="10" height="10" rx="3" fill="#8a471c" stroke="none"/>
    <text x="40" y="95" font-family="system-ui, 'Segoe UI', sans-serif" font-size="17" fill="#172c26" font-weight="650" letter-spacing="0" text-anchor="start">Approval required</text>
    <text x="380" y="94" font-family="'Cascadia Mono', Consolas, monospace" font-size="13" fill="#8a471c" font-weight="650" letter-spacing="0" text-anchor="end">waiting_approval</text>
    <rect x="16" y="119" width="10" height="10" rx="3" fill="#1b6e54" stroke="none"/>
    <text x="40" y="129" font-family="system-ui, 'Segoe UI', sans-serif" font-size="17" fill="#172c26" font-weight="650" letter-spacing="0" text-anchor="start">Deliverable saved</text>
    <text x="380" y="128" font-family="'Cascadia Mono', Consolas, monospace" font-size="13" fill="#1b6e54" font-weight="650" letter-spacing="0" text-anchor="end">completed</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="439" height="325" rx="23" fill="none" stroke="#b3c9be"/>
</svg>
