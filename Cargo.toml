[workspace]
members = ["crates/fliuno-protocol", "crates/fliuno-core", "crates/fliuno-providers", "crates/fliuno-mcp", "crates/fliuno-tools", "crates/fliuno-skills", "crates/fliuno-app-server", "crates/fliuno-sandbox", "crates/fliuno-acp", "crates/fliuno-agents", "crates/fliuno-exec", "crates/fliuno-terminal", "crates/fliuno-a2a"]
resolver = "3"

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
fliuno-protocol = { path = "crates/fliuno-protocol" }
fliuno-core = { path = "crates/fliuno-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
rusqlite = { version = "0.43", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
crossbeam-channel = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
windows = { version = "0.62", default-features = false, features = ["Win32_System_Threading"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Keep stack line information without producing multi-gigabyte full MSVC PDBs.
# CI and local contract tests use the same compact debug profile.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
