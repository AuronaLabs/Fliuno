[package]
name = "fliuno-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-fixtures = []

[dependencies]
fliuno-core.workspace = true
fliuno-protocol.workspace = true
fliuno-sandbox = { path = "../fliuno-sandbox" }
portable-pty = "0.9.0"
interprocess = { version = "2.4.8", features = ["tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "sync"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
base64 = "0.22"
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[lints]
workspace = true
