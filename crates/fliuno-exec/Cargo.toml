[package]
name = "fliuno-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-fixtures = []

[dependencies]
fliuno-core.workspace = true
fliuno-protocol.workspace = true
fliuno-sandbox = { path = "../fliuno-sandbox", features = ["async-io"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "io-util", "process", "time", "fs"] }


[target.'cfg(unix)'.dependencies]
process-wrap = { version = "10", default-features = false, features = ["tokio1", "kill-on-drop", "process-group"] }
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[[bin]]
name = "fliuno-exec-probe"
path = "src/bin/probe.rs"
required-features = ["test-fixtures"]
test = false

[lints]
workspace = true
