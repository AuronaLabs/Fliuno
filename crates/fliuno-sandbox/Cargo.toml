[package]
name = "fliuno-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
async-io = ["dep:tokio"]

[dependencies]
serde.workspace = true
uuid.workspace = true
sha2 = "0.10"
cap-std = "4.0.3"
tokio = { workspace = true, optional = true, features = ["io-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
serde_json.workspace = true

[[bin]]
name = "fliuno-sandbox-probe"
path = "src/bin/probe.rs"
test = false

# Native FFI is confined to platform backends. All other Fliuno crates forbid unsafe.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
