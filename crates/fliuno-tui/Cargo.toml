[package]
name = "fliuno-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "fliuno"
path = "src/main.rs"

[dependencies]
crossterm = "0.28.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_28", "layout-cache"] }
crossbeam-channel.workspace = true
fliuno-client = { path = "../fliuno-client" }
fliuno-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
unicode-segmentation = "1.12"
unicode-width = "0.2"
uuid.workspace = true

[dev-dependencies]
portable-pty = "0.9.0"
vt100 = "0.15.2"

[lints]
workspace = true
